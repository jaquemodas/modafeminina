<script>

function prod(id){const p=D.prods.find(x=>x.id==id);if(!p||!p.st)return '<p class="em">Produto não encontrado.</p>';

 ${p.cl.length?`<h4>Cor</h4><div class="chips">${p.cl.map(k=>`<button class="sz ${sel.cl==k?'on':''}" data-k="${H(k)}" ${E(function(event){sel.cl=this.dataset.k;go()})}>${H(k)}</button>`).join('')}</div>`:''}
 <button class="btn" ${E(function(event){add()})}>Adicionar à Sacola</button><button class="btn gh" ${E(function(event){fav(p.id)})}>${S.fav.includes(p.id)?'♥ Favoritado':'♡ Favoritar'}</button>
 <div class="inf"><span>🚚 Frete grátis acima de ${R(D.cfg.free)}</span><span>🔒 Compra segura pelo WhatsApp</span><span>💳 Parcelamento sem juros em até ${D.cfg.par}x</span></div>
 <h4>Descrição</h4><div class="ds">${H(p.d)}</div>${p.m?`<h4>Tabela de medidas</h4><div class="ds">${H(p.m)}</div>`:''}</div></div>`}

 const k=S.cart.find(i=>i.id==p.id&&i.sz==sel.sz&&i.cl==sel.cl);if((k?k.q:0)+1>p.sz[sel.sz])return toast('Estoque máximo atingido');

const GH=()=>{const h=location.hostname;return h.endsWith('.github.io')?[h.split('.')[0],location.pathname.split('/')[1]||h]:null};
const enc=new TextEncoder(),b64=u=>btoa(String.fromCharCode(...u)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),RES=u=>LOCAL[u]||u;
const dk=async(pw,salt)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

const gh=(p,o={})=>{const g=GH();if(!g)throw{code:'ng'};if(!TK)throw{code:'nt'};return fetch(`https://api.github.com/repos/${g[0]}/${g[1]}/contents/${p}`,{...o,headers:{Authorization:'Bearer '+TK,Accept:'application/vnd.github+json',...(o.body?{'Content-Type':'application/json'}:{})}})};

 const call=async(n,u,o={})=>{const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json',...(o.body?{'Content-Type':'application/json'}:{})}});let j={};try{j=await r.json()}catch(e){}L.push(`${n}: ${r.ok?'OK':'ERRO'} ${r.status}${!r.ok&&j.message?' – '+j.message:''}`);out();return[r,j]};

  if(!p3.ok){L.push('➡ '+(wrong?`O token é da conta ${j0.login}, mas este site é da conta ${g[0]}. Crie o token logado na conta ${g[0]}.`:'O GitHub não deu permissão de gravar a este token neste repositório. Crie um token clássico (marcando public_repo) ou confira "Only select repositories" e "Contents: Read and write".'));out();return toast('O passo 3 falhou. Veja o detalhe abaixo do botão.')}
  TK=t;await put('dados.json',JSON.stringify(D,null,1));SNAP=JSON.stringify(D);NEEDTK=false;init();toast('Ativado! Em ~1 minuto, qualquer aparelho edita só com a senha.')

const sform=()=>`<div class="fm">${TK&&!NEEDTK?'':`<div class="inf"><b>Ativar salvamento (só 1ª vez)</b><span>Cole o token do GitHub abaixo. Depois disso, este aviso some e qualquer aparelho edita só com a senha.<br>Este site usa o repositório <b>${(GH()||['?']).join('/')}</b>: o token precisa ser desse repositório.</span></div><input id="tk" type="password" placeholder="github_pat_..." style="margin-top:10px"><button class="btn" ${E(conn)}>Ativar salvamento</button><div id="dg" style="margin-top:10px;font-size:12px;color:var(--mut);word-break:break-word"></div>`}${F.map(([k,t])=>`<label>${t}</label><input id="s_${k}" value="${H(D.cfg[k])}">`).join('')}<button class="btn" ${E(function(event){ssv()})}>Salvar configurações</button></div>`;
function ssv(){F.forEach(([k])=>{const v=$('#s_'+k).value.trim();D.cfg[k]=['free','pix','par'].includes(k)?(parseFloat(v.replace(',','.'))||0):v});D.cfg.par=Math.max(1,D.cfg.par|0);save()}

addEventListener('hashchange',()=>{go();scrollTo(0,0)});(async()=>{SNAP=JSON.stringify(D);try{const r=await Promise.race([fetch('dados.json?t='+Date.now()),new Promise((_,j)=>setTimeout(j,4000))]);if(r.ok){const d=await r.json();if(d&&d.prods){D=d;SNAP=JSON.stringify(D)}}}catch(e){}init()})();
</script></body></html>
